<style>
.section{padding:48px 40px;scroll-margin-top:62px;max-width:1320px;margin:0 auto}

/* editorial masthead: transparent title overlaid on the photo strip (desktop);
   stacked plainly above it on mobile so nothing gets clipped either way */
.gmast{max-width:1320px;margin:0 auto;padding:56px 40px 0}
.gmast__kicker{text-align:center;margin-bottom:14px}
.gmast__stage{position:relative}
.gmast__title{font-size:clamp(2.4rem,9vw,6rem);line-height:.92;letter-spacing:-.02em;text-align:center;margin:0 0 16px}
.gmast__title em{color:var(--gold);font-style:italic}
.gmast__strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gmast__tile{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);background:var(--dark)}
.gmast__tile img{width:100%;height:100%;object-fit:cover}
.gmast__tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:linear-gradient(transparent,rgba(23,21,19,.85))}
.gmast__strip>*:nth-child(2){margin-top:30px}
.gmast__strip>*:nth-child(4){margin-top:52px}
@media(min-width:761px){
  .gmast__title{position:absolute;inset:0;z-index:3;margin:0;display:flex;align-items:center;justify-content:center;font-size:clamp(4.5rem,13vw,9.5rem);color:rgba(238,232,223,.72);mix-blend-mode:screen;pointer-events:none}
}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;overflow:hidden;aspect-ratio:3/4;background:var(--dark);border:0;padding:0;cursor:pointer;display:block;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s}
.tile:hover img{transform:scale(1.045)}
.tile__tag{position:absolute;left:12px;bottom:12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);background:rgba(23,21,19,.72);padding:5px 10px;border-radius:2px;opacity:0;transform:translateY(6px);transition:.25s}
.tile:hover .tile__tag,.tile:focus-visible .tile__tag{opacity:1;transform:none}
.tile__expand{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(23,21,19,.72);border:1px solid var(--line);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0;transform:translateY(-4px);transition:.25s}
.tile:hover .tile__expand,.tile:focus-visible .tile__expand{opacity:1;transform:none}

/* compact category picker — replaces the always-expanded grid; clicking a
   category feels like opening its own view instead of revealing more scroll */
.gpicker{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.gpicker__tile{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);background:var(--dark);cursor:pointer;padding:0}
.gpicker__tile img{width:100%;height:100%;object-fit:cover;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.gpicker__tile:hover img{transform:scale(1.06)}
.gpicker__tile span{position:absolute;left:0;right:0;bottom:0;padding:10px 6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream);background:linear-gradient(transparent,rgba(23,21,19,.88));text-align:center}

.gpicker,.gbrowse{scroll-margin-top:80px}
.gbrowse__bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.gbrowse__back{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gbrowse__back:hover{color:var(--gold)}
.gbrowse__filter{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 16px 8px 12px;color:var(--muted)}
.gbrowse__filter svg{flex-shrink:0}
.gbrowse__filter select{background:transparent;border:0;color:var(--cream);font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;outline:none;cursor:pointer}
.gbrowse__filter select option{background:var(--dark);color:var(--cream)}

/* asymmetric collage rhythm on the active category grid, desktop only */
.gbrowse .grid{grid-template-columns:repeat(4,1fr)}
.gbrowse .tile:nth-child(6n+3){grid-column:span 2}
.gbrowse .tile:nth-child(6n+5){margin-top:28px}

dialog.lightbox{border:0;padding:0;background:transparent;max-width:min(94vw,900px);max-height:92vh;margin:auto}
dialog.lightbox::backdrop{background:rgba(10,9,8,.92)}
.lightbox__inner{position:relative;display:flex;align-items:center;justify-content:center}
.lightbox__inner img{max-width:min(94vw,900px);max-height:88vh;width:auto;height:auto;object-fit:contain}
.lightbox__close,.lightbox__prev,.lightbox__next{position:fixed;background:rgba(23,21,19,.7);color:var(--cream);border:1px solid var(--line);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.lightbox__close{top:24px;right:24px}
.lightbox__prev{left:24px;top:50%;transform:translateY(-50%)}
.lightbox__next{right:24px;top:50%;transform:translateY(-50%)}
.lightbox__close:hover,.lightbox__prev:hover,.lightbox__next:hover{border-color:var(--gold);color:var(--gold)}
.lightbox__count{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font:italic 500 14px var(--serif);color:var(--muted);letter-spacing:.04em}

@media(max-width:900px){
  .grid,.gbrowse .grid{grid-template-columns:repeat(2,1fr)}
  .gbrowse .tile:nth-child(6n+3){grid-column:span 2}
  .gmast__strip{grid-template-columns:repeat(2,1fr)}
  .gpicker{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:760px){
  .section{padding:36px 20px}
  .grid,.gbrowse .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .gbrowse .tile:nth-child(6n+3),.gbrowse .tile:nth-child(6n+5){grid-column:auto;margin-top:0}
  .lightbox__prev,.lightbox__next{width:38px;height:38px;font-size:15px}
  .gmast{padding:40px 20px 0}
  .gmast__title{font-size:clamp(2.2rem,13vw,3rem)}
  .gmast__strip{grid-template-columns:repeat(2,1fr);gap:8px}
  .gmast__strip>*{margin-top:0!important}
  .gmast__strip>*:nth-child(3),.gmast__strip>*:nth-child(4){display:none}
  .gpicker{grid-template-columns:repeat(2,1fr);gap:8px}
}
</style>

  <div class="lightbox__count" id="lbCount" hidden></div>
</dialog>

<script>
const photos = [
  {f:'g37',cat:'color',alt:'Балаяж на дълга чуплива коса'},
  {f:'g38',cat:'color',alt:'Финни кичури на тъмна коса'},
  {f:'g44',cat:'nails',alt:'Френски маникюр с камъчета'},
  {f:'g46',cat:'cut',alt:'Каре с керемидено оцветяване'},
  {f:'g47',cat:'color',alt:'Наситен меден цвят'},
  {f:'g48',cat:'braids',alt:'Плитка на руса коса'},
  {f:'g49',cat:'style',alt:'Висока прическа с блясък'},
  {f:'g50',cat:'braids',alt:'Плитка на кок с плитки детайли'},
  {f:'g51',cat:'color',alt:'Каре с виолетови кичури'},
  {f:'g53',cat:'color',alt:'Наситен оранжев цвят'},
  {f:'g55',cat:'braids',alt:'Сложна плетена корона'},
  {f:'g57',cat:'braids',alt:'Плетена висока прическа'},
  {f:'g58',cat:'braids',alt:'Единична плитка'},
  {f:'g59',cat:'braids',alt:'Плетена корона с къдрици'},
  {f:'g60',cat:'braids',alt:'Тънки плитки, детайл'},
  {f:'g61',cat:'color',alt:'Наситен червен цвят'},
  {f:'g62',cat:'nails',alt:'Френски маникюр'},
  {f:'g64',cat:'nails',alt:'Маникюр с nail art'},
  {f:'g65',cat:'color',alt:'Контрастни кичури'},
  {f:'g66',cat:'color',alt:'Контрастни кичури на тъмна коса'}
];
const gpicker = document.getElementById('gpicker');
const gbrowse = document.getElementById('gbrowse');
const gridActive = document.getElementById('grid-active');
const gbackBtn = document.getElementById('gbackBtn');
const gSelect = document.getElementById('gbrowseSelect');
let activeSet = photos;

function renderGrid(cat) {
  activeSet = cat === 'all' ? photos : photos.filter(p => p.cat === cat);
  gridActive.innerHTML = '';
  activeSet.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.type = 'button';
    btn.innerHTML = `<img src="images/gallery/${p.f}.webp" alt="${p.alt}" loading="lazy" width="1100" height="1467"><span class="tile__tag">${p.alt}</span><span class="tile__expand" aria-hidden="true">&#8599;</span>`;
    btn.addEventListener('click', () => openLightbox(i));
    gridActive.appendChild(btn);
  });
}

function openCategory(cat) {
  renderGrid(cat);
  gSelect.value = cat;
  gpicker.hidden = true;
  gbrowse.hidden = false;
  gbrowse.scrollIntoView({behavior: 'smooth', block: 'start'});
}

function closeCategory() {
  gbrowse.hidden = true;
  gpicker.hidden = false;
  gpicker.scrollIntoView({behavior: 'smooth', block: 'start'});
}

document.querySelectorAll('.gpicker__tile').forEach(btn => {
  btn.addEventListener('click', () => openCategory(btn.dataset.cat));
});
gbackBtn.addEventListener('click', closeCategory);
gSelect.addEventListener('change', () => renderGrid(gSelect.value));

const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lightboxImg');
const lbClose = document.getElementById('lbClose');
const lbPrev = document.getElementById('lbPrev');
const lbNext = document.getElementById('lbNext');
const lbCount = document.getElementById('lbCount');
let current = 0;

function openLightbox(i) {
  current = i;
  showCurrent();
  lb.showModal();
  lbClose.hidden = false; lbPrev.hidden = false; lbNext.hidden = false; lbCount.hidden = false;
}
function showCurrent() {
  const p = activeSet[current];
  lbImg.src = `images/gallery/${p.f}.webp`;
  lbImg.alt = p.alt;
  lbCount.textContent = `${current + 1} / ${activeSet.length}`;
}
function closeLightbox() {
  lb.close();
  lbClose.hidden = true; lbPrev.hidden = true; lbNext.hidden = true; lbCount.hidden = true;
}
lbClose.addEventListener('click', closeLightbox);
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
lb.addEventListener('close', () => { lbClose.hidden = true; lbPrev.hidden = true; lbNext.hidden = true; lbCount.hidden = true; });
lbPrev.addEventListener('click', () => { current = (current - 1 + activeSet.length) % activeSet.length; showCurrent(); });
lbNext.addEventListener('click', () => { current = (current + 1) % activeSet.length; showCurrent(); });
window.addEventListener('keydown', e => {
  if (!lb.open) return;
  if (e.key === 'ArrowLeft') lbPrev.click();
  if (e.key === 'ArrowRight') lbNext.click();
});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduceMotion && 'IntersectionObserver' in window) {
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); } });
  }, {threshold: .15});
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
} else {
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('is-visible'));
}
</script>
